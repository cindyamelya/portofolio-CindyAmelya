
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background: white;
            display: flex;
            justify-content: center;
            font-family: "Times New Roman", Times, serif;
        }

        .container {
            background: #fde8e8;
            width: 430px;
            padding: 20px 25px;
            border: 1px solid #e6c2c2;
        }

        h2 {
            text-align: center;
            font-size: 19px;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            font-size: 12px;
        }

        td {
            padding: 4px;
            vertical-align: middle;
        }

        input[type="text"],
        input[type="password"] {
            border: 1px solid #999;
            background: white;
            height: 18px;
            font-size: 11px;
        }

        .full {
            width: 210px;
        }

        .small {
            width: 90px;
        }

        .day {
            width: 30px;
        }

        .year {
            width: 45px;
        }

        select {
            width: 215px;
            font-size: 11px;
            border: 1px solid #999;
        }

        textarea {
            width: 210px;
            height: 50px;
            border: 1px solid #999;
        }

        button {
            font-size: 10px;
            padding: 2px 6px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }
    </style>
</head>

<body>
    <div class="container">

        <h2>Student Registration Form</h2>

        <table>
            <tr>
                <td>Roll no. :</td>
                <td>
                    <input type="text" class="full">
                </td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input
                        type="text"
                        placeholder="First Name"
                        class="small"
                    >
                    -
                    <input
                        type="text"
                        placeholder="Last Name"
                        class="small"
                    >
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td>
                    <input type="text" class="full">
                </td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input type="text" placeholder="Day" class="day">
                    -
                    <input type="text" placeholder="Month" class="day">
                    -
                    <input type="text" placeholder="Year" class="year">
                    <i style="font-size: 11px;">
                        (DD-MM-YYYY)
                    </i>
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input
                        type="text"
                        value="+91"
                        style="width: 25px;"
                    >
                    -
                    <input
                        type="text"
                        style="width: 175px;"
                    >
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="text" class="full">
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password" class="full">
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>
                            --------Select Current Course's--------
                        </option>
                        <option>BCA</option>
                        <option>B.Tech</option>
                        <option>B.Sc</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td>
                    <input
                        type="file"
                        style="font-size: 11px;"
                    >
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text" class="full">
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea></textarea>
                </td>
            </tr>

            <tr>
                <td
                    colspan="2"
                    align="center"
                    style="padding-top: 10px;"
                >
                    <button type="button">Register</button>
                </td>
            </tr>
        </table>

    </div>
</body>
</html>
